name: Update flake.lock

# moves the flake's nixpkgs pin forward once a week, as a PR so the Nix build checks it before it lands
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - id: update
        uses: DeterminateSystems/update-flake-lock@v29
        with:
          branch: update-flake-lock
          commit-msg: Update flake.lock
          pr-title: Update flake.lock
          pr-body: |
            The weekly move of the flake's nixpkgs pin. Merge it once the Nix build is green.

            ```
            {{ env.GIT_COMMIT_MESSAGE }}
            ```
      # a PR opened with the workflow's own token starts no workflows, but a dispatched run does,
      # and its checks show up on the PR all the same
      - if: steps.update.outputs.pull-request-number != ''
        run: gh workflow run nix.yml --repo "$GITHUB_REPOSITORY" --ref update-flake-lock
        env:
          GH_TOKEN: ${{ github.token }}

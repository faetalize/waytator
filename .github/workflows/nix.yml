name: Nix

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: build (nixos-${{ matrix.nixpkgs }}, ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        # unstable is the flake as locked, what `nix run` gets. stable is what someone on the current NixOS
        # release gets by following the README, which builds the flake against their own nixpkgs
        nixpkgs: [unstable, stable]
        include:
          - nixpkgs: stable
            override: --override-input nixpkgs github:NixOS/nixpkgs/nixos-26.05
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L ${{ matrix.override }}
      - run: nix build -L ${{ matrix.override }}
      - name: Check wl-copy and tesseract ship with the app
        run: |
          nix path-info -r ./result | grep -q -- '-wl-clipboard-'
          nix path-info -r ./result | grep -q -- '-tesseract-'
      # waytator-minimal and the withOcr alias are checked from their derivations, without a second build.
      # tesseract is a direct input of the default package, so its absence from waytator-minimal's inputs
      # means OCR is off, and withOcr = false has to give that same derivation
      - name: Check waytator-minimal and withOcr = false leave tesseract out
        run: |
          inputs() { nix-store --query --references "$(nix eval --raw ${{ matrix.override }} "$@")"; }
          inputs .#waytator.drvPath | grep -q -- '-tesseract-'
          minimal=$(inputs .#waytator-minimal.drvPath)
          grep -q -- '-wl-clipboard-' <<< "$minimal"
          if grep -- '-tesseract-' <<< "$minimal"; then exit 1; fi
          [ "$(nix eval --raw ${{ matrix.override }} .#waytator --apply 'p: (p.override { withOcr = false; }).drvPath')" \
            = "$(nix eval --raw ${{ matrix.override }} .#waytator-minimal.drvPath)" ]

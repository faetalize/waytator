name: Nix

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: build (nixos-${{ matrix.nixpkgs }}, ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        # unstable is the flake as locked, what `nix run` gets. stable is what someone on the current NixOS
        # release gets by following the README, which builds the flake against their own nixpkgs
        nixpkgs: [unstable, stable]
        include:
          - nixpkgs: stable
            override: --override-input nixpkgs github:NixOS/nixpkgs/nixos-26.05
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L ${{ matrix.override }}
      - run: nix build -L ${{ matrix.override }}
      - name: Check wl-copy and tesseract ship with the app
        run: |
          nix path-info -r ./result | grep -q -- '-wl-clipboard-'
          nix path-info -r ./result | grep -q -- '-tesseract-'
      - run: nix build -L ${{ matrix.override }} .#waytator-minimal -o result-minimal
      - name: Check waytator-minimal ships wl-copy and no tesseract
        run: |
          closure=$(nix path-info -r ./result-minimal)
          grep -q -- '-wl-clipboard-' <<< "$closure"
          if grep -- '-tesseract-' <<< "$closure"; then exit 1; fi
      # what OCR adds is the paths in the closure of the app with it and not without it. for comparison, the
      # same for the all-languages tesseract nixpkgs ships by default, read from the binary cache
      - name: Closure sizes
        run: |
          mib() { awk '{ sum += $2 } END { printf "%.1f MiB\n", sum / 1048576 }'; }
          minimal=$(nix path-info -r ./result-minimal | sort)
          echo "waytator:         $(nix path-info -S ./result | mib)"
          echo "waytator-minimal: $(nix path-info -S ./result-minimal | mib)"
          echo "OCR, English:     $(comm -23 <(nix path-info -r ./result | sort) <(echo "$minimal") | grep -v -- '-waytator-' | xargs nix path-info -s | mib)"
          if [ "${{ matrix.nixpkgs }}" = unstable ]; then
            cache=(--store https://cache.nixos.org)
            # a store path rather than the installable, which nix would try to build into the cache
            tesseract=$(nix eval --raw --inputs-from . nixpkgs#tesseract.outPath)
            all=$(nix path-info "${cache[@]}" -r "$tesseract" | sort)
            echo "OCR, every language (nixpkgs' default tesseract): $(comm -23 <(echo "$all") <(echo "$minimal") | xargs nix path-info "${cache[@]}" -s | mib)"
          fi
